version: '3.8'

services:
  # ── Servicio 1: Base de datos PostgreSQL ──────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: apagos_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-tesoreria}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-tesoreria}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Servicio 2: API Backend (Express + Node.js) ───────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apagos_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Sobrescribimos las variables del .env para conectarnos por la red interna de Docker
      DB_HOST: db
      DB_PORT: 5432
      PORT: 3000
      # El frontend corre en el puerto 80 del contenedor "frontend"
      # En producción Docker, el cliente accede por localhost:80 → nginx → /api/ → api:3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      EXPEDIENTES_PATH: /mnt/nas_pagos/CWM
      NAS_PAYMENTS_PATH: /mnt/nas_bancos/CWM
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: America/Mexico_City
    volumes:
      # Montar carpeta de credenciales FIEL (certificados .cer y .key)
      - ./credenciales:/usr/src/app/credenciales:ro
      # Carpetas temporales de descarga del SAT
      - apagos_temp_uploads:/usr/src/app/temp_uploads
      - apagos_temp_paquetes:/usr/src/app/temp_paquetes
      # Montaje directo del NAS para expedientes
      - /volume1/pagos:/mnt/nas_pagos
      - /volume1/BANCOS:/mnt/nas_bancos
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # ── Servicio 3: Dashboard React (Nginx) ───────────────────────────────────
  frontend:
    build:
      context: ./dashboard-cwm
      dockerfile: Dockerfile
      args:
        # Cuando Nginx hace proxy reverso, el frontend llama a /api/ (relativo)
        # Así no hay problemas de CORS ni URLs hardcodeadas
        VITE_API_URL: ""
    container_name: apagos_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

  # ── Servicio 4: Redis (Colas BullMQ y Caché) ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: apagos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ai_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: apagos-ai-worker
    restart: always
    env_file: .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
    volumes:
      - /volume1/BANCOS:/mnt/nas_bancos
      - /volume1/pagos:/mnt/nas_pagos
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data: {}
  redis_data: {}
  apagos_temp_uploads: {}
  apagos_temp_paquetes: {}
